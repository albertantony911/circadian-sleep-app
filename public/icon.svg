<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="circadian" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" stroke="#27272A" stroke-width="2" fill="none" />
  
  <!-- Crescent Moon -->
  <path d="M 280 130 A 130 130 0 1 0 380 290 A 105 105 0 0 1 280 130 Z" fill="#8B5CF6" filter="url(#glow)" opacity="0.9"/>
  <path d="M 280 130 A 130 130 0 1 0 380 290 A 105 105 0 0 1 280 130 Z" fill="#A78BFA"/>

  <!-- Circadian Sinusoidal Wave -->
  <path d="M 100 370 Q 180 300 256 370 T 412 370" fill="none" stroke="url(#circadian)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 100 370 Q 180 300 256 370 T 412 370" fill="none" stroke="url(#circadian)" stroke-width="8" stroke-linecap="round"/>

  <!-- Melatonin Peak Star -->
  <circle cx="180" cy="335" r="7" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="180" cy="335" r="5" fill="#FEF3C7" />
</svg>
